{% extends "base.html" %}
{% block content %}
<p><a href="/jingle-finder">&larr; Jingle Finder</a></p>
<h1>Manueller Modus: {{ feed.title }}</h1>
<p class="muted">Neueste Episode: {{ episode.title }}</p>

<div class="card">
  <div class="flex player-row">
    <button type="button" class="secondary skip-btn" data-skip="-10">-10s</button>
    <button type="button" class="secondary skip-btn" data-skip="-1">-1s</button>
    <audio id="player" controls src="/media/audio/originals/{{ episode.id }}.mp3"></audio>
    <button type="button" class="secondary skip-btn" data-skip="1">+1s</button>
    <button type="button" class="secondary skip-btn" data-skip="10">+10s</button>
  </div>

  <div class="timeline-wrap">
    <div class="timeline" id="timeline" data-duration-ms="{{ duration_ms }}">
      <div class="timeline-ruler" id="timeline-ruler"></div>
      <div class="timeline-segment conf-high" id="tl-selection" style="display:none;">
        <div class="handle handle-left" data-edge="start"></div>
        <div class="segment-label">Auswahl</div>
        <div class="handle handle-right" data-edge="end"></div>
      </div>
      <div class="timeline-playhead" id="playhead"></div>
    </div>
  </div>

  <div class="flex" style="margin-top:0.5rem;">
    <button type="button" id="add-selection" class="secondary">Bereich an aktueller Abspielposition hinzufügen</button>
  </div>
  <p class="muted small">Danach die Ränder der Auswahl auf der Zeitleiste ziehen, um Start/Ende festzulegen.</p>
</div>

<form method="post" action="/jingle-finder/extract" id="manual-extract-form">
  <input type="hidden" name="episode_id" value="{{ episode.id }}">
  <div class="flex">
    <label>Start <input type="text" id="sel-start-display" class="mmss-input" value="0:00" disabled></label>
    <input type="hidden" name="start_s" id="sel-start-seconds" value="0">
    <button type="button" id="jump-to-start" class="secondary">Zu Start springen</button>
    <label>Ende <input type="text" id="sel-end-display" class="mmss-input" value="0:05" disabled></label>
    <input type="hidden" name="end_s" id="sel-end-seconds" value="5">
    <label>Dateiname
      <input type="text" name="filename" size="22"
             value="{{ feed.title | lower | replace(' ', '_') | replace('-', '_') }}_jingle.mp3">
    </label>
    <button type="submit" id="save-selection-btn" disabled>Als Jingle speichern</button>
  </div>
</form>
{% endblock %}

{% block scripts %}
<script src="/static/js/timeline.js"></script>
<script src="/static/js/jingle_finder.js"></script>
{% endblock %}
